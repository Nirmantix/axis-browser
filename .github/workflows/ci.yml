name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # No job here pushes; don't leave GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      # Covers test/, which the build config excludes and so never typechecked.
      - run: pnpm run typecheck

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The 20.11 floor that engines.node claims cannot run this job: pnpm
        # 11.1.1 (packageManager) requires Node >=22.13, so `pnpm install` fails
        # on the toolchain before any of our code executes. That entry was a
        # permanently-red check testing nothing. The floor is verified instead
        # by `engines-floor` below, which smoke-tests the built artifact on
        # 20.11 with plain node — no pnpm involved.
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v4
        with:
          # No job here pushes; don't leave GITHUB_TOKEN in .git/config for later steps.
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test

  engines-floor:
    # engines.node claims ">=20.11" (import.meta.dirname landed there) and no
    # other job runs on it, so without this the floor is a promise nothing checks.
    #
    # This installs the packed tarball rather than executing dist/ in place. The
    # difference matters: running dist/ by path skips the `bin` wiring entirely,
    # and that wiring is exactly what broke once before — every alias pointed at
    # a missing dist/bin entry, so the published CLI did not exist (see the first
    # "Fixed" entry in CHANGELOG.md). A floor check that cannot catch that is not
    # worth having.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      # pnpm 11 requires Node >=22.13, so pack on a Node it supports. `npm pack`
      # runs `prepare`, which is what builds dist/ into the tarball.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # --pack-destination does not create the directory; npm exits non-zero if
      # it is missing.
      - run: mkdir -p "$RUNNER_TEMP/pkg" && npm pack --pack-destination "$RUNNER_TEMP/pkg"

      # Everything below runs on the floor itself, with plain npm and node.
      - uses: actions/setup-node@v6
        with:
          node-version: "20.11"

      - name: Installed CLI works on the engines.node floor
        run: |
          node --version
          mkdir -p "$RUNNER_TEMP/floor"
          cd "$RUNNER_TEMP/floor"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/pkg/*.tgz
          # Every documented alias, not just one: they are separate bin entries.
          ./node_modules/.bin/axis-browser --version
          ./node_modules/.bin/axis-browser --help > /dev/null
          ./node_modules/.bin/axib --version
          ./node_modules/.bin/chrome-devtools-axi --version
